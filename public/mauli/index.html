px;background:#eef2ff;color:#3730a3}.notice{background:#f0f9ff;border:1px solid #bae6fd;color:#0c4a6e;padding:12px;border-radius:10px;font-size:13px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.field input,.field select{width:100%;padding:9px;border:1px solid #d0d5dd;border-radius:8px;background:#fff}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.side{width:270px}}@media(max-width:750px){.app{display:block}.side{position:relative;width:100%;height:auto}.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}}

function cat(m){
  const x=(m.label+' '+m.form).toLowerCase();
  if(x.includes('report')||x.includes('ledger')||x.includes('balance sheet')||x.includes('income & expenditure')||x.includes('trial balance')||x.includes('register')) return 'Reports';
  if(x.includes('stat')) return 'Statutory';
  if(x.includes('member')||x.includes('account')||x.includes('group')||x.includes('society')||x.includes('bill setting')||x.includes('master')) return 'Masters & Setup';
  if(x.includes('receipt')||x.includes('payment')||x.includes('journal')||x.includes('transfer')||x.includes('contra')||x.includes('bill')||x.includes('transaction')||x.includes('opening balance')||x.includes('bank')) return 'Transactions';
  if(x.includes('utility')||x.includes('backup')||x.includes('import')||x.includes('email')||x.includes('whatsup')||x.includes('year')||x.includes('rebuild')||x.includes('renumber')||x.includes('path')||x.includes('login')) return 'Utilities & Integrations';
  return 'Other';
}
const cats=['Dashboard','Masters & Setup','Transactions','Reports','Utilities & Integrations','Statutory','Other'];
let active=null;
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function renderNav(){
  const q=document.getElementById('search').value.toLowerCase();
  const groups={};
  menus.filter(m=>(m.label+' '+m.form).toLowerCase().includes(q)).forEach(m=>(groups[cat(m)]??=[]).push(m));
  let h='<div class="cat">Dashboard</div><div class="item '+(!active?'active':'')+'" onclick="showDashboard()">Dashboard <span class="count">1</span></div>';
  cats.slice(1).forEach(c=>{const arr=groups[c]||[];h+='<div class="cat">'+esc(c)+' <span class="count">'+arr.length+'</span></div>';h+=arr.map(m=>'<div class="item '+(active===m.form?'active':'')+'" onclick="openMenu('+JSON.stringify(m.form)+')">'+esc(m.label||m.form)+'</div>').join('')});
  document.getElementById('nav').innerHTML=h;
}
function showDashboard(){
 active=null;renderNav();
 const counts={};menus.forEach(m=>counts[cat(m)]=(counts[cat(m)]||0)+1);
 document.getElementById('content').innerHTML='<div class="grid">'+
  [['Legacy Forms',menus.length],['Masters & Setup',counts['Masters & Setup']||0],['Transactions',counts['Transactions']||0],['Reports',counts['Reports']||0]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="kpi">'+x[1]+'</div></div>').join('')+
 '</div><div class="two section"><div class="card"><h3>Core Business Flow</h3><div class="notice">LOGIN → DATA PATH → SOCIETY → FINANCIAL YEAR → MASTERS → BILLING / INTEREST → RECEIPTS / VOUCHERS → LEDGER / BOOKS → BANK RECONCILIATION → REPORTS → PRINT / EXCEL / EMAIL → YEAR OPERATIONS</div><div class="toolbar"><button class="btn primary" onclick="openMenu(\'frmSocietyMaster\')">Open Society Master</button><button class="btn" onclick="openMenu(\'frmMember\')">Open Member Master</button><button class="btn" onclick="openMenu(\'frmMemBilling\')">Open Billing</button></div></div><div class="card"><h3>Coverage</h3><p class="muted">Every form from the supplied legacy form inventory is listed in the left menu. Selecting a form opens its modern web screen shell and shows the source event-handler footprint.</p><p><span class="pill">H2 development</span> <span class="pill">PostgreSQL ready</span> <span class="pill">Spring Boot API ready</span></p></div></div>'+
 '<div class="card section"><h3>Menu coverage by category</h3><table><thead><tr><th>Category</th><th>Forms</th></tr></thead><tbody>'+Object.entries(counts).map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+v+'</td></tr>').join('')+'</tbody></table></div>';
}
function openMenu(form){
 const m=menus.find(x=>x.form===form)||menus.find(x=>x.label===form)||menus.find(x=>x.form.includes(form));
 active=m?.form||form;renderNav();
 if(!m){showDashboard();return}
 const c=cat(m);
 document.getElementById('content').innerHTML='<div class="card"><div class="muted">'+esc(c)+' / Legacy Form</div><h2>'+esc(m.label||m.form)+'</h2><div class="notice"><b>Legacy form:</b> '+esc(m.form)+'<br><b>Load handler:</b> '+esc(m.load||'Not listed')+'<br><b>Events:</b> '+esc(m.events||'Not listed')+'</div>'+
 '<div class="toolbar"><button class="btn primary" onclick="demo(\'Add / Save\')">Add / Save</button><button class="btn" onclick="demo(\'Update\')">Update</button><button class="btn danger" onclick="demo(\'Delete\')">Delete</button><button class="btn" onclick="demo(\'Print / Preview\')">Print / Preview</button></div>'+
 '<div class="section form">'+['Code / Number','Date / Period','Name / Particular','Amount','Account / Member','Status'].map((l,i)=>'<div class="field"><label>'+l+'</label><input placeholder="Enter '+l.toLowerCase()+'"></div>').join('')+'</div>'+

}
